<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Idle game：樹林大革命 v1.0.8b</title>
    <link rel="stylesheet" href="css/style.css?v=1.0.8b">
</head>
<body>

    <header>
        <h1>Idle game：樹林大革命 OwO</h1>
    </header>

    <!-- 轉生動畫 Overlay -->
    <div id="prestige-overlay">✨ 初級轉生中... 重塑森林與大地 ✨</div>

    <!-- 遊戲主要版面配置 -->
    <div class="game-layout">
        
        <!-- 左側/上方：資源與進位切換欄 -->
        <aside class="sidebar-resources">
            <div class="toggle-container">
                <span>科學記號 (e)</span>
                <label class="switch">
                    <input type="checkbox" id="number-format-toggle" onchange="toggleNumberFormat(this.checked)">
                    <span class="slider"></span>
                </label>
                <span>單位簡寫 (K-zz)</span>
            </div>
            <div class="resource-container" id="resource-container"></div>
        </aside>

        <!-- 右側/下方：主頁面內容 -->
        <main class="game-main">
            <!-- 頂部導覽列 -->
            <div class="nav-tabs" id="main-nav-tabs" style="display: none;">
                <div class="nav-group" id="nav-group-maps" style="display: none;">
                    <button class="nav-btn active" id="nav-map1" onclick="switchView('map1')">🌲 平原樹林</button>
                    <button class="nav-btn" id="nav-map2" onclick="switchView('map2')">❄️ 寒帶針葉林</button>
                    <button class="nav-btn" id="nav-map3" onclick="switchView('map3')" style="display: none;">🌳 闊木林</button>
                    <button class="nav-btn" id="nav-map4" onclick="switchView('map4')" style="display: none;">🌸 櫻花林</button>
                </div>

                <div class="nav-divider" id="nav-divider-1" style="display: none;"></div>

                <div class="nav-group" id="nav-group-features" style="display: none;">
                    <button class="nav-btn feature-btn" id="nav-recycle" onclick="toggleRecycleView()">♻️ 回收廠</button>
                </div>

                <div class="nav-divider" id="nav-divider-2" style="display: none;"></div>

                <div class="nav-group" id="nav-group-prestige" style="display: none;">
                    <button class="nav-btn prestige-btn" id="nav-prestige" onclick="togglePrestigeView()">🔮 初級轉生</button>
                </div>
            </div>

            <!-- 第一區 -->
            <div class="page-view active" id="page-map1">
                <div class="section-box">
                    <div class="section-title">⚙️ 機器人運作狀態 (平原)</div>
                    <div id="robot-list-map1"></div>
                </div>
                <div class="section-box">
                    <div class="section-title">🛠️ 升級中心</div>
                    <div class="tab-container" id="tab-container-map1"></div>
                    <div class="upgrade-list" id="upgrade-list-map1"></div>
                </div>
            </div>

            <!-- 第二區 -->
            <div class="page-view" id="page-map2">
                <div class="section-box">
                    <div class="section-title">⚙️ 機器人運作狀態 (寒帶)</div>
                    <div id="robot-list-map2"></div>
                </div>
                <div class="section-box">
                    <div class="section-title">🛠️ 升級中心</div>
                    <div class="tab-container" id="tab-container-map2"></div>
                    <div class="upgrade-list" id="upgrade-list-map2"></div>
                </div>
            </div>

            <!-- 第三區 -->
            <div class="page-view" id="page-map3">
                <div class="section-box">
                    <div class="section-title">⚙️ 機器人運作狀態 (闊木)</div>
                    <div id="robot-list-map3"></div>
                </div>
                <div class="section-box">
                    <div class="section-title">🛠️ 升級中心</div>
                    <div class="tab-container" id="tab-container-map3"></div>
                    <div class="upgrade-list" id="upgrade-list-map3"></div>
                </div>
            </div>

            <!-- 第四區 -->
            <div class="page-view" id="page-map4">
                <div class="section-box">
                    <div class="section-title">⚙️ 機器人運作狀態 (櫻花)</div>
                    <div id="robot-list-map4"></div>
                </div>
                <div class="section-box">
                    <div class="section-title">🛠️ 升級中心</div>
                    <div class="tab-container" id="tab-container-map4"></div>
                    <div class="upgrade-list" id="upgrade-list-map4"></div>
                </div>
            </div>

            <div class="page-view" id="page-recycle">
				<div class="section-box">
					<div class="section-title">♻️ 回收轉換開關 (週期: <span id="recycle-timer-desc">10.0</span> 秒)</div>
        
					<!-- 新增：回收廠子分頁按鈕 -->
					<div class="tab-container" id="tab-container-recycle" style="margin-bottom: 15px;">
						<button class="tab-btn active" onclick="switchRecycleTab('material', this)">📦 材料轉換</button>
						<button class="tab-btn" onclick="switchRecycleTab('coin', this)">💰 回收幣轉換</button>
					</div>

					<div class="progress-bar-container" style="margin-bottom: 15px;">
						<div class="progress-bar" id="recycle-bar"></div>
					</div>
					<div id="recycle-options-list"></div>
                </div>
                <div class="section-box">
                    <div class="section-title">🛠️ 回收廠科技升級</div>
                    <div class="upgrade-list" id="upgrade-list-recycle"></div>
                </div>
            </div>

            <!-- 轉生區 -->
            <div class="page-view" id="page-prestige">
                <div class="section-box">
                    <div class="prestige-box">
                        <h2>🔮 進行初級轉生</h2>
                        <!-- 已修正下方這段說明文字，補上闊木林與櫻花林 -->
                        <p>將當前平原樹林、寒帶針葉林、闊木林、櫻花林與回收廠的進度重置，換取強大的初級轉生硬幣！</p>
                        <p style="font-size: 1.1rem; color: #4cc9f0; margin-bottom: 20px;">
                            轉生後可獲得：<b id="prestige-gain-preview" style="font-size: 1.5rem; color: #ffd166;">0</b> 個初級轉生硬幣
                        </p>
                        <button class="prestige-btn-main" id="prestige-btn" onclick="executePrestige()">立即轉生</button>
                    </div>
                    <div class="section-title">🔮 初級轉生科技天賦</div>
                    <div class="upgrade-list" id="upgrade-list-prestige"></div>
                </div>
            </div>
        </main>
    </div>

    <footer>
        <button class="sys-btn" onclick="saveGame()">手動存檔</button>
        <button class="sys-btn success" onclick="exportSave()">匯出存檔代碼</button>
        <button class="sys-btn success" onclick="importSave()">匯入存檔代碼</button>
        <button class="sys-btn danger" onclick="resetGame()">重置存檔</button>
    </footer>

    <!-- 載入腳本：先載入資料設定檔，再載入邏輯控制檔 -->
    <script src="js/data.js?v=1.0.8b"></script>
    <script src="js/game.js?v=1.0.8b"></script>
</body>
</html>
